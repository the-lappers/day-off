sonar.projectKey=the-lappers_day-off
sonar.organization=the-lappers


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=day-off
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Go coverage, written by the "Go test coverage" step in .github/workflows/build.yml.
# cmd/ is startup wiring, exercised by running the server rather than by unit tests.
sonar.go.coverage.reportPaths=backend/coverage.out
sonar.coverage.exclusions=backend/cmd/**,**/*_test.go
