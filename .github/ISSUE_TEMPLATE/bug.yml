name: Bug report
description: Something is broken (normally goes in Jira instead)
labels: ["type:bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [frontend, backend, pipeline, eval, infra]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened vs what you expected
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. make dev\n2. open /search\n3. ..."
    validations: { required: true }
  - type: input
    id: commit
    attributes:
      label: Commit / branch
