name: discord-notify

on:
  deployment_status

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event.deployment_status.state == 'success' || github.event.deployment_status.state == 'failure' || github.event.deployment_status.state == 'error'
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATE: ${{ github.event.deployment_status.state }}
          ENVIRONMENT: ${{ github.event.deployment.environment }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
          REF: ${{ github.event.deployment.ref }}
        run: |
          if [ "$STATE" = "success" ]; then EMOJI="✅"; else EMOJI="❌"; fi
          curl -X POST -H "Content-Type: application/json" \
            -d "{\"content\": \"$EMOJI Deployment **$STATE** on **$ENVIRONMENT** ($REF)\n$TARGET_URL\"}" \
            "$DISCORD_WEBHOOK_URL"
