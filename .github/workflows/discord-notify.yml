name: discord-notify

on:
  deployment_status

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event.deployment_status.state == 'success' || github.event.deployment_status.state == 'failure' || github.event.deployment_status.state == 'error'
    steps:
      - name: Debug event payload
        run: echo '${{ toJSON(github.event) }}'

      - name: Look up commit info
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.event.deployment.sha }}")
          echo "author=$(echo "$DATA" | jq -r '.commit.author.name')" >> "$GITHUB_OUTPUT"
          echo "message=$(echo "$DATA" | jq -r '.commit.message' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATE: ${{ github.event.deployment_status.state }}
          ENVIRONMENT: ${{ github.event.deployment.environment }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
          SHA_FULL: ${{ github.event.deployment.sha }}
          AUTHOR: ${{ steps.commit.outputs.author }}
          COMMIT_MSG: ${{ steps.commit.outputs.message }}
        run: |
          if [ "$STATE" = "success" ]; then COLOR=3066993; else COLOR=15158332; fi
          SHORT_SHA="${SHA_FULL:0:7}"
          curl -X POST -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"Deployment $STATE\",
                \"url\": \"$TARGET_URL\",
                \"color\": $COLOR,
                \"fields\": [
                  {\"name\": \"Environment\", \"value\": \"$ENVIRONMENT\", \"inline\": true},
                  {\"name\": \"Commit\", \"value\": \"$SHORT_SHA\", \"inline\": true},
                  {\"name\": \"Author\", \"value\": \"$AUTHOR\", \"inline\": true},
                  {\"name\": \"Message\", \"value\": \"$COMMIT_MSG\", \"inline\": false}
                ],
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }]
            }" \
            "$DISCORD_WEBHOOK_URL"
