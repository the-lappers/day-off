version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: monthly }
    labels: ["type:chore", "area:infra"]
    commit-message: { prefix: "ci" }
  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups: { all: { patterns: ["*"] } }
    labels: ["type:chore", "area:frontend"]
    commit-message: { prefix: "chore", include: scope }
  - package-ecosystem: gomod
    directory: /backend
    target-branch: dev
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups: { all: { patterns: ["*"] } }
    labels: ["type:chore", "area:backend"]
    commit-message: { prefix: "chore", include: scope }
